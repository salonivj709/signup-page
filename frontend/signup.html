<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Signup</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="signup-container">

        <h1>Create Account</h1>

        <p class="subtitle">
            Sign up to get started
        </p>


        <form id="signupForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit">
                Sign Up
            </button>

        </form>


        <p id="message"></p>


        <p class="login-link">

            Already have an account?

            <a href="#">
                Login
            </a>

        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
