<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-container">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your account
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>


        <p class="signup-link">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>

    </div>


    <script src="login.js"></script>

</body>

</html>
